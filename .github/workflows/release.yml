name: Release

on:
  push:
    branches: ["**"]
    tags:
      - "v*.*.*"
  pull_request:

permissions:
  contents: write

jobs:
  ci:
    name: Lint + typecheck + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v1
        with:
          runtime: node@26
          cache: true

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm fmt:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm dlx web-ext@10.5.0 lint --source-dir=dist

      - name: Build dev archive
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: cd dist && zip -j ../mal-firefox-addon-dev.zip manifest.json content.js LICENSE

      - uses: actions/upload-artifact@v7
        if: "!startsWith(github.ref, 'refs/tags/v')"
        with:
          name: mal-firefox-addon-dev
          path: mal-firefox-addon-dev.zip
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: ci
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v1
        with:
          runtime: node@26
          cache: true

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Build release archive
        run: |
          TAG="${GITHUB_REF_NAME}"
          cd dist && zip -j "../mal-firefox-addon-${TAG}.zip" manifest.json content.js LICENSE
          echo "ARCHIVE=mal-firefox-addon-${TAG}.zip" >> "$GITHUB_ENV"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.ARCHIVE }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
